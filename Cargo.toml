[workspace]
resolver = "2"

members = [
  "module/unilang",
  "module/unilang_parser",
  "module/unilang_meta",
  "module/cargo_unilang",
]
dev-dependencies = {}
build-dependencies = {}

[workspace.metadata]
repo_url = "https://github.com/Wandalen/unilang"
discord_url = "https://discord.gg/m3yKnHRAGr"

[workspace.dependencies]
# ========================================
# Workspace Member Crates
# ========================================
unilang = { version = "~0.51.0", path = "module/unilang", default-features = false }
unilang_parser = { version = "~0.33.0", path = "module/unilang_parser", default-features = false }
unilang_meta = { version = "~0.1.0", path = "module/unilang_meta", default-features = false }
cargo_unilang = { version = "~0.1.0", path = "module/cargo_unilang", default-features = false }

# ========================================
# Core Dependencies
# ========================================
serde = { version = "1" }
url = { version = "2" }
chrono = { version = "0.4" }
regex = { version = "1" }
log = { version = "0.4" }

# ========================================
# Format Parsers
# ========================================
serde_json = { version = "1" }
serde_yaml = { version = "0.9" }  # deprecated upstream; migrate to serde_yml when capacity allows
toml = { version = "1" }
ron = { version = "0.12" }

# ========================================
# Infrastructure
# ========================================
phf = { version = "0.13" }
walkdir = { version = "2" }
indexmap = { version = "2" }
lru = { version = "0.16" }
toml_edit = { version = "0.25" }

# ========================================
# wTools Ecosystem
# ========================================
error_tools = { version = "~0.38.0" }
mod_interface = { version = "~0.59.0" }
former = { version = "~2.43.0" }
strs_tools = { version = "~0.44.0" }
iter_tools = { version = "~0.47.0" }
macro_tools = { version = "~0.82.0" }
component_model_types = { version = "~0.24.0" }
cli_fmt = { version = "~0.3.0" }
test_tools = { version = "~0.16.0" }

# ========================================
# Performance Optimizations
# ========================================
simd-json = { version = "0.17" }
memchr = { version = "2" }
bytecount = { version = "0.6" }

# ========================================
# Optional Dependencies
# ========================================
rustyline = { version = "18.0" }
prost = { version = "0.14" }
async-graphql = { version = "7" }
utoipa = { version = "5" }
libloading = { version = "0.9" }
bincode = { version = "1" }  # future dep; bincode 3.x requires explicit feature selection before upgrading

# ========================================
# Build Dependencies
# ========================================
phf_codegen = { version = "0.13", default-features = false }

# ========================================
# Dev Dependencies
# ========================================
assert_cmd = { version = "2" }
predicates = { version = "3" }
assert_fs = { version = "1" }
clap = { version = "4" }
pico-args = { version = "0.5" }
tempfile = { version = "3" }
criterion = { version = "0.8" }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
