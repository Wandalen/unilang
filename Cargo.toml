[workspace]
resolver = "2"

members = [
  "module/unilang",
  "module/unilang_parser",
  "module/unilang_meta",
  "module/cargo_unilang",
]

[workspace.metadata]
repo_url = "https://github.com/Wandalen/unilang"
discord_url = "https://discord.gg/m3yKnHRAGr"

[workspace.dependencies]
# ========================================
# Workspace Member Crates
# ========================================
unilang = { version = "=0.57.0", path = "module/unilang", default-features = false }
unilang_parser = { version = "=0.39.1", path = "module/unilang_parser", default-features = false }
unilang_meta = { version = "=0.4.0", path = "module/unilang_meta", default-features = false }
cargo_unilang = { version = "=0.4.0", path = "module/cargo_unilang", default-features = false }

# ========================================
# Core Dependencies
# ========================================
serde = { version = "^1.0" }
url = { version = "^2.0" }
chrono = { version = "^0.4" }
regex = { version = "^1.0" }
log = { version = "^0.4" }

# ========================================
# Format Parsers
# ========================================
serde_json = { version = "^1.0" }
serde_yaml_ng = { version = "^0.10" }

# ========================================
# Infrastructure
# ========================================
phf = { version = "^0.14" }
walkdir = { version = "^2.0" }
indexmap = { version = "^2.0" }
lru = { version = "^0.18" }
toml_edit = { version = "^0.25" }

# ========================================
# wTools Ecosystem
# ========================================
error_tools = { version = "^0.41" }
mod_interface = { version = "^0.65" }
former = { version = "^2.45" }
strs_tools = { version = "^0.49" }
macro_tools = { version = "^0.88" }
component_model_types = { version = "^0.56" }

# ========================================
# Performance Optimizations
# ========================================
simd-json = { version = "^0.17" }
memchr = { version = "^2.0" }
bytecount = { version = "^0.6" }

# ========================================
# Optional Dependencies
# ========================================
rustyline = { version = "^18.0" }

# ========================================
# Build Dependencies
# ========================================
phf_codegen = { version = "^0.14", default-features = false }

# ========================================
# Dev Dependencies
# ========================================
assert_cmd = { version = "^2.0" }
predicates = { version = "^3.0" }
assert_fs = { version = "^1.0" }
tempfile = { version = "^3.0" }
trybuild = { version = "^1.0" }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
