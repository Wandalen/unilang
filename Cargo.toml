[workspace]
resolver = "2"

members = [
  "module/unilang",
  "module/unilang_parser",
  "module/unilang_meta",
  "module/cargo_unilang",
]

[workspace.metadata]
repo_url = "https://github.com/Wandalen/unilang"
discord_url = "https://discord.gg/m3yKnHRAGr"

[workspace.dependencies]
# ========================================
# Workspace Member Crates
# ========================================
unilang = { version = "=0.55.0", path = "module/unilang", default-features = false }
unilang_parser = { version = "=0.37.0", path = "module/unilang_parser", default-features = false }
unilang_meta = { version = "=0.1.0", path = "module/unilang_meta", default-features = false }
cargo_unilang = { version = "=0.2.0", path = "module/cargo_unilang", default-features = false }

# ========================================
# Core Dependencies
# ========================================
serde = { version = "^1.0" }
url = { version = "^2.0" }
chrono = { version = "^0.4" }
regex = { version = "^1.0" }
log = { version = "^0.4" }

# ========================================
# Format Parsers
# ========================================
serde_json = { version = "^1.0" }
serde_yaml_ng = { version = "^0.10" }
toml = { version = "^1.0" }
ron = { version = "^0.12" }

# ========================================
# Infrastructure
# ========================================
phf = { version = "^0.13" }
walkdir = { version = "^2.0" }
indexmap = { version = "^2.0" }
lru = { version = "^0.18" }
toml_edit = { version = "^0.25" }

# ========================================
# wTools Ecosystem
# ========================================
error_tools = { version = "^0.40" }
mod_interface = { version = "^0.64" }
former = { version = "^2.45" }
strs_tools = { version = "^0.46" }
iter_tools = { version = "^0.50" }
macro_tools = { version = "^0.87" }
component_model_types = { version = "^0.56" }
test_tools = { version = "^0.17" }

# ========================================
# Performance Optimizations
# ========================================
simd-json = { version = "^0.17" }
memchr = { version = "^2.0" }
bytecount = { version = "^0.6" }

# ========================================
# Optional Dependencies
# ========================================
rustyline = { version = "^18.0" }
prost = { version = "^0.14" }
async-graphql = { version = "^7.0" }
utoipa = { version = "^5.0" }
libloading = { version = "^0.9" }
bincode = { version = "^1.0" }  # future dep; 3.0.0 is a broken poison-pill release; stay on 1.x

# ========================================
# Build Dependencies
# ========================================
phf_codegen = { version = "^0.13", default-features = false }

# ========================================
# Dev Dependencies
# ========================================
assert_cmd = { version = "^2.0" }
predicates = { version = "^3.0" }
assert_fs = { version = "^1.0" }
clap = { version = "^4.0" }
pico-args = { version = "^0.5" }
tempfile = { version = "^3.0" }
criterion = { version = "^0.8" }
trybuild = { version = "^1.0" }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
