[package]
name = "unilang"
version = "0.56.0"
edition = "2021"
rust-version = "1.70"
authors = [
  "Kostiantyn Mysnyk <wandalen@obox.systems>",
]
license = "MIT"
readme = "readme.md"
documentation = "https://docs.rs/unilang"
repository = "https://github.com/Wandalen/unilang/tree/master/module/unilang"
homepage = "https://github.com/Wandalen/unilang/tree/master/module/unilang/readme.md"
description = """
Define your command-line utility interface once and get consistent interaction across multiple modalities — CLI, GUI, TUI, AUI, Web APIs, and more—essentially for free.
"""
categories = [ "command-line-interface", "command-line-utilities" ]
keywords = [ "wtools", "CLI", "CUI", "user-interface" ]
build = "build/main.rs"
# Note: stress_test_bin in tests/ causes a harmless warning about duplicate targets

[package.metadata.docs.rs]
features = [ "full", "error_tools/enabled", "mod_interface/enabled", "former/enabled" ]
all-features = false

[features]
# ========================================
# Default Configuration (ONLY Approach #2)
# ========================================
# By default, ONLY multi-YAML build-time static approach is enabled.
# This is the recommended production approach for 95% of users.
# To use other approaches, explicitly enable their feature flags.

default = [ "enabled", "simd", "repl", "enhanced_repl", "approach_yaml_multi_build" ]

# ========================================
# Approach Features (User-Facing)
# ========================================
# Each approach is self-contained - just enable the one you want.
# Note: Approach #7 (Rust DSL builder) is always available as core API.

# Implemented approaches (8 features):
approach_yaml_single_build = [ "static_registry", "yaml_parser" ]              # #1: Single YAML → Build-time static
approach_yaml_multi_build = [ "static_registry", "yaml_parser", "multi_file" ] # #2: Multi-YAML → Build-time static (DEFAULT)
approach_yaml_runtime = [ "yaml_parser" ]                                       # #3: YAML → Runtime loading

approach_json_single_build = [ "static_registry", "json_parser" ]              # #4: Single JSON → Build-time static
approach_json_multi_build = [ "static_registry", "json_parser", "multi_file" ] # #5: Multi-JSON → Build-time static
approach_json_runtime = [ "json_parser" ]                                       # #6: JSON → Runtime loading

# Approach #7 (Rust DSL builder): NO FEATURE - Always available as core API

approach_rust_dsl_const = [ "static_registry" ]                                # #8: Rust DSL const fn → Static
approach_hybrid = [ "static_registry" ]                                         # #18: Hybrid (static + runtime)


# ========================================
# Infrastructure Features (Building Blocks)
# ========================================
# These are automatically enabled by approach features above.
# Advanced users can enable these directly for custom configurations.

# Enables compile-time perfect-hashed command registries.
# When enabled:
# - Build scripts generate code using PHF maps for O(1) command lookup
# - PHF types (phf::Map, phf::phf_map, etc.) are re-exported via unilang::phf
# - No need to add phf as a direct dependency
# See readme.md "PHF Re-export" section for usage examples.
static_registry = [ "dep:phf", "dep:phf_codegen" ]  # Static command registry infrastructure
phf_error_hint = []                          # Documentation feature for PHF compile error hint (no dependencies)
yaml_parser = [ "dep:serde_yaml_ng" ]        # YAML parsing support (build-time + runtime)
json_parser = [ "dep:serde_json" ]           # JSON parsing support (build-time + runtime)
multi_file = [ "dep:walkdir" ]               # Multi-file auto-discovery (any format)



# ========================================
# Convenience Features
# ========================================

# Full feature set (all implemented approaches):
full = [
  "enabled",
  "on_unknown_suggest",
  "simd",
  "repl",
  "enhanced_repl",
  "approach_yaml_single_build",
  "approach_yaml_multi_build",
  "approach_yaml_runtime",
  "approach_json_single_build",
  "approach_json_multi_build",
  "approach_json_runtime",
  "approach_rust_dsl_const",
  "approach_hybrid"
]

# All YAML approaches:
all_yaml_approaches = [
  "approach_yaml_single_build",
  "approach_yaml_multi_build",
  "approach_yaml_runtime"
]

# All JSON approaches:
all_json_approaches = [
  "approach_json_single_build",
  "approach_json_multi_build",
  "approach_json_runtime"
]

# All build-time static approaches:
all_static_approaches = [
  "approach_yaml_single_build",
  "approach_yaml_multi_build",
  "approach_json_single_build",
  "approach_json_multi_build",
  "approach_rust_dsl_const",
  "approach_hybrid"
]

# All runtime approaches:
all_runtime_approaches = [
  "approach_yaml_runtime",
  "approach_json_runtime"
]

# ========================================
# Core & Performance Features
# ========================================

enabled = [
  "dep:serde", "dep:url", "dep:chrono", "dep:regex",
  "dep:error_tools", "dep:mod_interface", "dep:former",
  "dep:unilang_parser", "unilang_parser/enabled",
  "dep:log", "dep:indexmap", "dep:lru",
]
advanced_cli_tests = [ ]

# WebAssembly-compatible feature set - excludes platform-specific dependencies
wasm = [ "enabled" ]

# SIMD performance optimizations - enabled by default for maximum performance
simd = [ "enabled", "simd-json", "memchr", "bytecount", "unilang_parser/simd" ]

# REPL (Read-Eval-Print Loop) support
repl = []
enhanced_repl = [ "repl", "dep:rustyline" ]

# Command suggestions when command is unknown
on_unknown_suggest = [ ]

[dependencies]
# Core dependencies (gated by `enabled` feature):
serde = { workspace = true, features = ["derive"], optional = true }
url = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"], optional = true }
regex = { workspace = true, optional = true }

# Format parsers (optional, gated by infrastructure features):
serde_json = { workspace = true, optional = true }      # Enabled by json_parser
serde_yaml_ng = { workspace = true, optional = true }   # Enabled by yaml_parser

# Static registry infrastructure (optional):
phf = { workspace = true, features = ["macros"], optional = true }  # Enabled by static_registry
phf_codegen = { workspace = true, optional = true }                 # Enabled by static_registry; struct-literal codegen in src/

# Multi-file discovery (optional):
walkdir = { workspace = true, optional = true }         # Enabled by multi_file


## internal
error_tools = { workspace = true, features = [ "enabled", "error_typed", "error_untyped" ], optional = true }
mod_interface = { workspace = true, features = [ "enabled" ], optional = true }
former = { workspace = true, features = [ "enabled", "derive_former" ], optional = true }
unilang_parser = { workspace = true, optional = true } # SIMD features controlled by main unilang features

## external
log = { workspace = true, optional = true }
rustyline = { workspace = true, optional = true } # Enhanced REPL with history and arrow keys
indexmap = { workspace = true, optional = true }
lru = { workspace = true, optional = true } # LRU cache for hot command optimization

# Performance optimization dependencies
simd-json = { workspace = true, optional = true } # SIMD-optimized JSON parsing
memchr = { workspace = true, optional = true } # SIMD-optimized byte searching (6x faster than std)
bytecount = { workspace = true, optional = true } # SIMD byte counting and operations


[[bin]]
name = "unilang_cli"
path = "src/bin/unilang_cli/main.rs"
required-features = ["enabled"]

[[example]]
name = "help_conventions_demo"
path = "examples/18_help_conventions_demo.rs"

# Examples requiring JSON parser feature
[[example]]
name = "02_argument_types"
required-features = ["json_parser"]

[[example]]
name = "07_yaml_json_loading"
required-features = ["json_parser"]

[[example]]
name = "10_full_pipeline"
required-features = ["json_parser"]

[[example]]
name = "12_error_handling"
required-features = ["json_parser"]

[[example]]
name = "14_advanced_types_validation"
required-features = ["json_parser"]

[[example]]
name = "16_comprehensive_loader_demo"
required-features = ["json_parser"]

[[example]]
name = "validate_organization"
path = "examples/validate_organization/main.rs"

[[example]]
name = "assess_quality_cli"
path = "examples/assess_quality_cli.rs"

[build-dependencies]
# Core (always available):
serde_yaml_ng = { workspace = true }  # Always available for build.rs (only used when static_registry enabled)

# Build-time format parsers (optional, gated by infrastructure features):
serde_json = { workspace = true, optional = true }     # Enabled by json_parser

# Static registry codegen (optional):
phf_codegen = { workspace = true, optional = true }   # Enabled by static_registry

# Multi-file discovery (optional):
walkdir = { workspace = true, optional = true }        # Enabled by multi_file

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
assert_fs = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }  # For build-time test verification
trybuild = { workspace = true }  # For compile_fail tests (M2)


[package.metadata.cargo-udeps.ignore]
normal = []
build = []
