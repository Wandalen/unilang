[build-dependencies]
# Core (always available):
serde = { workspace = true }
serde_yaml = { workspace = true }  # Always available for build.rs (only used when static_registry enabled)

# Build-time format parsers (optional, gated by infrastructure features):
serde_json = { workspace = true, optional = true }     # Enabled by json_parser
toml = { workspace = true, optional = true }           # Enabled by toml_parser (future)
ron = { workspace = true, optional = true }            # Enabled by ron_parser (future)

# Static registry codegen (optional):
phf_codegen = { workspace = true, optional = true }   # Enabled by static_registry

# Multi-file discovery (optional):
walkdir = { workspace = true, optional = true }        # Enabled by multi_file

[dev-dependencies]
test_tools = { workspace = true, features = [ "full" ] }
assert_cmd = { workspace = true }
predicates = { workspace = true }
assert_fs = { workspace = true }
clap = { workspace = true }
pico-args = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }  # For build-time test verification

criterion = { workspace = true }

[package.metadata.cargo-udeps.ignore]
# REMOVED: num_cpus and sysinfo (dependencies removed in Phase 2)
normal = []
build = ["phf_codegen"]
