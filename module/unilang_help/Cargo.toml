[package]
name = "unilang_help"
version = "0.2.0"
edition = "2021"
license = "MIT"
readme = "readme.md"
authors = [ "Kostiantyn Mysnyk <wandalen@obox.systems>" ]
categories = [ "command-line-interface" ]
keywords = [ "help", "cli", "unilang", "renderer" ]
description = """
Reusable help-page domain model, verbosity levels, and renderers for unilang-style CLIs.
"""
documentation = "https://docs.rs/unilang_help"
repository = "https://github.com/Wandalen/unilang/tree/master/module/unilang_help"
homepage = "https://github.com/Wandalen/unilang/tree/master/module/unilang_help/readme.md"

[features]
default = [
  "enabled",
]
# Master switch. cli_fmt's column-aligned, colour-aware detail-page template
# is a mandatory part of this crate's renderer surface — there is no
# plain-text-only configuration that excludes it.
enabled = [ "dep:cli_fmt" ]
full = [
  "enabled",
]

[dependencies]
cli_fmt = { workspace = true, optional = true }
