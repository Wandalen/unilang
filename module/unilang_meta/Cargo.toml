[package]
name = "unilang_meta"
version = "0.7.1"
edition = "2021"
authors = [
  "Kostiantyn Mysnyk <wandalen@obox.systems>",
]
license = "MIT"
readme = "readme.md"
documentation = "https://docs.rs/unilang_meta"
repository = "https://github.com/Wandalen/unilang/tree/master/module/unilang_meta"
homepage = "https://github.com/Wandalen/unilang/tree/master/module/unilang_meta/readme.md"
description = """
Macros for unilang. Define your command-line utility interface once and get consistent interaction across multiple modalities — CLI, GUI, TUI, AUI, Web APIs, and more—essentially for free.
"""
categories = [ "algorithms", "development-tools" ]
keywords = [ "fundamental", "general-purpose" ]

[package.metadata.docs.rs]
features = [ "full" ]
all-features = false

[lib]
proc-macro = true

[features]
default = [
  "enabled",
]
full = [
  "enabled",
]
enabled = [ "dep:macro_tools", "dep:component_model_types", "dep:unilang", "unilang/enabled", "macro_tools/enabled", "component_model_types/enabled" ]

derive_as_mut = []
derive_as_ref = []
derive_deref = []
derive_deref_mut = []
derive_from = []
derive_new = []
derive_index = []
derive_index_mut = []
derive_inner_from = []
derive_not = []
derive_phantom = []

[dependencies]
macro_tools = { workspace = true, features = [ "full" ], optional = true }
component_model_types = { workspace = true, features = [ "types_component_assign" ], optional = true }
unilang = { workspace = true, features = [ "enabled" ], optional = true }

[dev-dependencies]
trybuild = { workspace = true }
unilang = { workspace = true, features = [ "enabled" ] }

[package.metadata.cargo-udeps.ignore]
# `unilang` is used in proc macro token streams via `qt! { ::unilang::data::... }` — udeps
# cannot detect usage inside quote! expansions (false positive).
normal = [ "unilang" ]
